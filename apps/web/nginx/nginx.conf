worker_processes 4;

events {
  worker_connections 1024;
}

http {
  include mime.types;

  default_type  application/octet-stream;

  set_real_ip_from        0.0.0.0/0;
  real_ip_recursive       on;
  real_ip_header          X-Forwarded-For;
  limit_req_zone          $binary_remote_addr zone=mylimit:10m rate=10r/s;

  access_log /dev/stdout;
  error_log /dev/stderr;

  server {
    listen 3000;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
      root   /usr/share/nginx/html;
      index  index.html index.htm;
      try_files $uri $uri/ /index.html;
    }

    # Locale JSON files are volume-mounted and hot-editable; never let the
    # browser serve a stale copy after a translation update.
    location /locales/ {
      root /usr/share/nginx/html;
      add_header Cache-Control "no-cache";
      try_files $uri =404;
    }

    # index.html references hashed assets; never let the browser serve a stale
    # HTML document that references old chunks (causes hydration mismatches).
    location = /index.html {
      root /usr/share/nginx/html;
      add_header Cache-Control "no-cache";
    }
  }
}
